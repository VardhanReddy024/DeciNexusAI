<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="amberNexusGrad" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#FB923C" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="amberInnerGrad" x1="12" y1="12" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.8" />
    </linearGradient>
  </defs>
  <!-- Outer faceted hex/diamond nexus -->
  <polygon points="24,4 42,14 42,34 24,44 6,34 6,14" stroke="url(#amberNexusGrad)" stroke-width="2.6" stroke-linejoin="round" fill="#111827" fill-opacity="0.95"/>
  <!-- Inner geometric core -->
  <polygon points="24,12 34,18 34,30 24,36 14,30 14,18" stroke="url(#amberInnerGrad)" stroke-width="1.8" stroke-linejoin="round" fill="none"/>
  <!-- Decision intersection nodes -->
  <circle cx="24" cy="24" r="3.5" fill="#F59E0B"/>
  <circle cx="24" cy="12" r="2" fill="#FFFFFF"/>
  <circle cx="34" cy="24" r="2" fill="#FBBF24"/>
  <circle cx="24" cy="36" r="2" fill="#D97706"/>
  <circle cx="14" cy="24" r="2" fill="#FFFFFF"/>
  <!-- Connecting intelligence rays -->
  <line x1="24" y1="24" x2="24" y2="12" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="2 2"/>
  <line x1="24" y1="24" x2="34" y2="24" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="2 2"/>
  <line x1="24" y1="24" x2="24" y2="36" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="2 2"/>
  <line x1="24" y1="24" x2="14" y2="24" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="2 2"/>
</svg>
